name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Ti permette di farlo partire a comando dalla tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Rename Signed APK
      run: mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/release/Smart-register.apk

    - name: Extract Version and Check Prerelease
      id: extract_info
      if: github.event_name == 'push'
      run: |
        MSG=$(cat << 'EOF'
        ${{ github.event.head_commit.message }}
        EOF
        )
        VERSION=$(echo "$MSG" | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | head -n 1)
        if [ -n "$VERSION" ]; then
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release=true" >> $GITHUB_OUTPUT
        else
          echo "release=false" >> $GITHUB_OUTPUT
        fi
        if echo "$MSG" | grep -iq "prerelease"; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && steps.extract_info.outputs.release == 'true'
      with:
        tag_name: ${{ steps.extract_info.outputs.version }}
        name: "Smart-register ${{ steps.extract_info.outputs.version }}"
        body: |
          🚀 **Release ${{ steps.extract_info.outputs.version }} created successfully**
          This APK is ready and signed.
        draft: false
        prerelease: ${{ steps.extract_info.outputs.prerelease == 'true' }}
        files: app/build/outputs/apk/release/Smart-register.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
