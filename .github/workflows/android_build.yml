name: Android CI/CD + Auto Sign & Rename

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4[cite: 4]

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle[cite: 4]

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3[cite: 3]

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew[cite: 4]

      - name: Build Release APK
        run: ./gradlew assembleRelease[cite: 4]

      - name: Sign Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          # FORZA LA VERSIONE DEI TOOLS PER EVITARE L'ERRORE 29.0.3
          buildToolsVersion: 34.0.0[cite: 3]

      - name: Rename Signed APK
        run: mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/release/smart-register.apk[cite: 4]

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/smart-register.apk
          generate_release_notes: true[cite: 4]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}[cite: 4]
