name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Rename Signed APK
      run: mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/release/Smart-register.apk

    - name: Extract Version and Description
      id: extract_info
      if: github.event_name == 'push'
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        echo "DEBUG: Checking commit message for version..."
        
        # This regex matches v1, v1.0, v1.0.1, V1.0.1-beta, etc.
        VERSION=$(echo "$COMMIT_MSG" | grep -oEi '[vV][0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.]+)?' | head -n 1)
        
        if [ -n "$VERSION" ]; then
          TAG=$(echo "$VERSION" | tr 'A-Z' 'a-z')
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "release=true" >> $GITHUB_OUTPUT
          echo "✅ Found version: $TAG"

          # Extract description
          DESC=$(echo "$COMMIT_MSG" | sed -E "s/$VERSION//I" | sed -E "s/[Pp]rerelease//g" | sed -E 's/^[[:space:]:,-]+//')
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESC" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "release=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No version found in commit message. Skipping Release creation."
        fi

        if echo "$COMMIT_MSG" | grep -iq "prerelease"; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
          echo "⚠️ Marked as a Prerelease."
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && steps.extract_info.outputs.release == 'true'
      with:
        tag_name: ${{ steps.extract_info.outputs.version }}
        name: "Smart-register ${{ steps.extract_info.outputs.version }}"
        body: |
          ${{ steps.extract_info.outputs.description }}
        draft: false
        prerelease: ${{ steps.extract_info.outputs.prerelease == 'true' }}
        files: app/build/outputs/apk/release/Smart-register.apk
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
